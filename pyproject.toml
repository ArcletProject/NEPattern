[project]
name = "nepattern"
version = "1.3.0"
description = "a complex pattern, support typing"
authors = [
    {name = "RF-Tar-Railt", email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "typing-extensions>=4.16.0",
    "tarina>=0.7.5",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "typing",
    "pattern",
    "converter",
    "validator"
]
classifiers=[
    "Typing :: Typed",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
[project.urls]
repository = "https://github.com/ArcletProject/NEPattern"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool]
[tool.pdm]

[tool.pdm.build]
includes = ["nepattern"]

[tool.pdm.scripts]
test = {composite = ["coverage run --rcfile=pyproject.toml -m pytest -vv", "coverage xml", "coverage report -m"]}

[tool.coverage.run]
branch = true
source = ["."]
omit = ["test.py", "./nepattern/*.pyi", "./nepattern/func.py", "exam*.py"]

[tool.coverage.report]

# Regexes for lines to exclude from consideration
exclude_lines = [
    # standard pragma
    "pragma: no cover",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if (typing\\.)?TYPE_CHECKING( is True)?:",
    "\\.\\.\\.",
    "pass",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    # Don't complain overload method / functions
    "@(typing\\.)?overload",
    "def __repr__",
    "def __str__",
    "def __eq__",
    "except ImportError:",
]

[tool.pytest.ini_options]
python_files = "test.py"

[tool.ruff]
line-length = 120
target-version = "py311"
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q"]
ignore = ["C901", "T201", "E731", "E402", "PYI055"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
extra-standard-library = ["typing_extensions"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
enableExperimentalFeatures = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "coverage>=7.16.2",
    "ruff>=0.17.5",
]
